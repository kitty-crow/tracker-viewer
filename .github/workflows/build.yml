name: Validate
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install
      - run: bun run validate
      - run: bun run build
      - name: Confirm standalone Windows output
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (!(Test-Path 'release/TrackerViewer.exe')) { throw 'Missing Windows executable' }
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: TrackerViewer-Windows
          path: release/TrackerViewer.exe
