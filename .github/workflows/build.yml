name: Build
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run build
      - run: node --check server.mjs
      - name: Smoke-test local server
        run: |
          node server.mjs > /tmp/tracker-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error http://127.0.0.1:59413/ -o /tmp/tracker-index.html; then
              grep -qi '<html' /tmp/tracker-index.html
              exit 0
            fi
            sleep 1
          done
          cat /tmp/tracker-server.log
          exit 1
